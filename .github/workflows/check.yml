name: Check plugin
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/devtools-client.test.mjs
      - run: node --check skills/tgstat-channel-analysis/scripts/collect.js
      - run: node --check skills/tgstat-channel-analysis/scripts/devtools-client.mjs
